name: Validate guide

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium webkit
      - name: Rebuild and check committed output
        run: |
          python tools/build_site.py
          git diff --exit-code -- docs source/sources.json
          test -z "$(git ls-files --others --exclude-standard docs source/sources.json)"
      - name: Check data and JavaScript behavior
        run: |
          python -m unittest discover -s tests -v
          for f in tests/*.cjs; do node "$f"; done
      - name: Check desktop and mobile browsers
        run: python tools/browser_smoke.py --browser all --output test-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          if-no-files-found: ignore
